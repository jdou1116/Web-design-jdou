<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pop Albums</title>
    <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Anonymous Pro', monospace;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

       .rectangle {
            position: relative;
            width: 95%;
            max-width: 1000px;
            height: 645px; 
            background: rgb(224, 250, 255);
            border: 2px solid rgb(147, 221, 236);
            border-radius: 10px;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            box-sizing: border-box;
        }

        .rectangle-tab {
            position: absolute;     
            top: -45px;         
            left: 100px;               
            transform: translateX(-50%); 
            width: 100px;            
            height: 40px;           
            background: rgb(224, 250, 255);
            border: 2px solid rgb(147, 221, 236);
            border-radius: 5px;
            display: flex;           
            justify-content: center; 
            align-items: center;  
        }


        .rectangle-texts {
            font-family: 'Anonymous Pro', monospace;
            font-size: 18px;  
            color: rgb(96, 168, 182);
        }

       .album {
    display: block;
    width: 150px;
    height: 150px;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease; 
}

.album img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.album:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 15px rgba(0,0,0,0.2);
}

    </style>
</head>
<body>

  <div class="rectangle">
    <div class="rectangle-tab">
        <span class="rectangle-texts">POP</span>
    </div>

    <a href="after-hour/index.html" class="album">
        <img src="album1.jpg" alt="Album 1">
    </a>
    <a href="enternal-Sunshine/index.html" class="album">
        <img src="album2.jpg" alt="Album 2">
    </a>
    <a href="#" class="album">
        <img src="album3.jpg" alt="Album 3">
    </a>
    <a href="#" class="album">
        <img src="album4.jpg" alt="Album 4">
    </a>
</div>


</body>
</html>
