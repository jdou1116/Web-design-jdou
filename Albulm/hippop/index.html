    <style>

        body {
            margin: 0;
            font-family: 'Anonymous Pro', monospace;
            background-image: url("hippop.png");
            background-repeat: no-repeat;
            background-size: 1300px auto; 
            background-position: center center;
            background-color: #fff;
            min-height: 100vh;
            position: relative;
        }

       .cards-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-59%, -48%);
            width: 900px;                
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
        }

        .card {
            width: 140px;
            height: 190px; 
            background: #27272a;
            color: #f9fafb;
            padding: 12px; 
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .image {
            width: 100%;
            height: 130px; 
            object-fit: cover;
            transition: transform 0.5s;
        }


        .card-link {
            display: inline-block;
            text-decoration: none;
            color: inherit;
        }

        .card:hover .image {
            transform: scale(1.1);
        }

        .content {
            position: absolute;
            font-family: 'Anonymous Pro', monospace;
            left: 0;
            bottom: -36px; 
            width: 120px;
            padding: 14px;
            transition: transform 0.5s;
        }

        .card:hover .content {
            transform: translateY(-48px);
        }

        .content-bg {
            position: absolute;
            left: 0;
            top: 0;
            width: 140px;  
            height: 70px; 
            background: #1e3a8a;
            opacity: 0;
            z-index: -1;
            transition: opacity 0.5s;
        }

        .card:hover .content-bg {
            opacity: 0.5;
            transform: translateY(-4px);
        }

        .title {
            font-size: 1rem;
            font-family: 'Anonymous Pro', monospace;
            font-weight: bold;
        }

        .desc {
            margin-top: 6px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .card:hover .desc {
            opacity: 1;
        }

        .nav-imgs {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            z-index: 20;
        }

        .nav-imgs img {
            width: 48px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .nav-imgs img:hover {
            transform: scale(1.1);
        }


        

    </style>
</head>
