<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>drop-down</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      #ul {
        list-style: none;
        width: 100px;
        background-color: rgb(150, 150, 150);
      }
      
      li {
        color: black;
        padding: 10px;
      }
      
    </style>
  </head>
  <body>
    <div class="dropdown">
      <button id="btn">menu</button>
      <ul id="ul">
        <li>A</li>
        <li>B</li>
        <li>C</li>
      </ul>
    </div>
  </body>
</html>
