<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hover Examples</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
      }

      .container {
        max-width: 800px;
        width: 100%;
      }

      h1 {
        text-align: center;
        color: white;
        margin-bottom: 50px;
        font-size: 2.5rem;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
      }

      .card {
        background: rgb(0, 0, 0);
        padding: 40px 30px;
        text-align: center;
        cursor: pointer;
      }

      .card h3 {
        color: #ffffff;
        margin-bottom: 10px;
        font-size: 20px;
      }

      .scale-up{
        transition: all 0.3s, ease-in-out;
      }
      scale-up:hover

      /* Lift Up with Shadow */

      /* Color Change */

      /*  Rotate */

      /* Border Expand */

      /* blur to clear */
      .blur:hover{
        filter: blur(4px);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Hover Animation Examples</h1>
      <div class="grid">
        <div class="card scale-up">
          <h3>Scale Up</h3>
        </div>

        <div class="card">
          <h3>Lift & Shadow</h3>
        </div>

        <div class="card">
          <h3>Color Change</h3>
        </div>

        <div class="card">
          <h3>Rotate</h3>
        </div>

        <div class="card">
          <h3>Border Expand</h3>
        </div>

        <div class="card blur">
          <h3>Blur</h3>
        </div>
      </div>
    </div>
  </body>
</html>
